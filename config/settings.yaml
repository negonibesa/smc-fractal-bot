# SMC FRACTAL BOT — CONFIGURATION
# Multi-pair config with per-pair settings

# ─── STRATEGY PARAMETERS (default) ───────────────────────────
strategy:
  lookback: 12
  sweep_threshold: 0.008
  center_proximity: 0.012
  tp_multiplier: 1.0
  timeout: 15
  tp_mode: 'structure'  # 'r_multiple' или 'structure'
  structure_tp_lookback: 50

# ─── TRAILING STOP ──────────────────────────────────────────
trailing:
  enabled: true
  breakeven_at: 0.3
  trail_activate: 0.8
  trail_step: 0.3

# ─── RISK MANAGEMENT ───────────────────────────────────────
risk:
  risk_percent: 1.0
  commission: 0.001
  slippage: 0.0005
  stop_buffer: 0.002
  max_drawdown: 10.0
  max_daily_loss: 5.0
  max_consecutive_losses: 3
  max_daily_trades: 20
  max_leverage: 10

# ─── DYNAMIC RISK (DD + PF) ────────────────────────────────
dynamic_risk:
  enabled: true
  base_risk: 1.5
  min_risk: 0.75
  max_risk: 2.0
  dd_threshold_1: 6.0
  dd_threshold_2: 10.0
  pf_hot: 2.0
  pf_window: 20

# ─── FILTERS ───────────────────────────────────────────────
filters:
  adx_filter:
    enabled: true
    min_adx: 25
  vwap_filter:
    enabled: false
  session_filter:
    enabled: false
  volume_filter:
    enabled: false
    volume_multiplier: 1.5

# ─── AUTO-OPTIMIZATION ──────────────────────────────────────
optimizer:
  trigger_days: 90
  trigger_trades: 15
  trigger_pf_drop: 1.2
  cooldown_trades: 30
  optimize_params:
    - lookback
    - sweep_threshold
    - center_proximity
    - tp_multiplier
    - timeout
  param_ranges:
    lookback: [8, 12]
    sweep_threshold: [0.005, 0.008, 0.012]
    center_proximity: [0.005, 0.008, 0.012]
    tp_multiplier: [1.0, 2.0]
    timeout: [6, 15]
  min_improvement: 0.10

