# SMC FRACTAL BOT — CONFIGURATION
# Multi-pair config with per-pair settings

# ─── STRATEGY PARAMETERS (default) ───────────────────────────
strategy:
  lookback: 12
  sweep_threshold: 0.008
  center_proximity: 0.012
  tp_multiplier: 1.0
  timeout: 15

# ─── TRAILING STOP ──────────────────────────────────────────
trailing:
  enabled: true
  breakeven_at: 0.5
  trail_activate: 1.0
  trail_step: 0.5

# ─── RISK MANAGEMENT ───────────────────────────────────────
risk:
  risk_percent: 1.0
  commission: 0.001
  slippage: 0.0005
  stop_buffer: 0.002

# ─── DYNAMIC RISK (circuit breaker) ────────────────────────
dynamic_risk:
  enabled: true
  default_risk: 1.5      # Normal risk when DD ≤ threshold
  reduced_risk: 1.0      # Reduced risk when DD > threshold
  dd_threshold: 10.0     # Drawdown % to trigger reduction

# ─── FILTERS ───────────────────────────────────────────────
filters:
  adx_filter:
    enabled: true
    min_adx: 25
  vwap_filter:
    enabled: false
  session_filter:
    enabled: false
  volume_filter:
    enabled: false
    volume_multiplier: 1.5

# ─── AUTO-OPTIMIZATION ──────────────────────────────────────
optimizer:
  trigger_days: 30
  trigger_trades: 20
  trigger_pf_drop: 1.2
  optimize_params:
    - lookback
    - sweep_threshold
    - center_proximity
    - tp_multiplier
    - timeout
  param_ranges:
    lookback: [8, 12]
    sweep_threshold: [0.005, 0.008, 0.012]
    center_proximity: [0.005, 0.008, 0.012]
    tp_multiplier: [1.0, 2.0]
    timeout: [6, 15]
  min_improvement: 0.10

# ─── ASSETS ─────────────────────────────────────────────────
assets:
  - symbol: BNBUSDT
    enabled: true
    data_file: data/raw/BNBUSDT_4h_12m.csv
    # BNB: PF=4.53 WR=70% Ret=+27% DD=1.85% (46 trades, 12m)
    # Best config: lb=12 sw=0.008 prox=0.012 tp=1.0 timeout=15 ADX=ON
    # No extra filters — baseline already excellent
    config:
      strategy:
        lookback: 12
        sweep_threshold: 0.008
        center_proximity: 0.012
        tp_multiplier: 1.0
        timeout: 15
      filters:
        adx_filter:
          enabled: true
          min_adx: 25
      trailing:
        enabled: true
        breakeven_at: 0.5
        trail_activate: 1.0
        trail_step: 0.5

  - symbol: RENDERUSDT
    enabled: true
    data_file: data/raw/RENDERUSDT_4h_12m.csv
    # RENDER: PF=2.67 WR=46% Ret=+39% DD=3.17% (102 trades, 14m)
    # OOS PF=3.39 Ret=+25% — ROBUST
    # +session filter: OOS PF=2.76, Ret=+13% (v2 improvement)
    config:
      strategy:
        lookback: 12
        sweep_threshold: 0.008
        center_proximity: 0.012
        tp_multiplier: 1.0
        timeout: 15
      filters:
        adx_filter:
          enabled: true
          min_adx: 25
        session_filter:
          enabled: true
      trailing:
        enabled: true
        breakeven_at: 0.5
        trail_activate: 1.0
        trail_step: 0.5

  - symbol: XRPUSDT
    enabled: true
    data_file: data/raw/XRPUSDT_4h_12m.csv
    # XRP: PF=3.56 baseline, PF=85.52 with session+trend_1d (10 trades, DD=0.11%)
    # Period stress: Bear PF=4.53, Sideways PF=2.47 — ROBUST
    config:
      strategy:
        lookback: 12
        sweep_threshold: 0.008
        center_proximity: 0.012
        tp_multiplier: 1.0
        timeout: 15
      filters:
        adx_filter:
          enabled: true
          min_adx: 25
        session_filter:
          enabled: true
        trend_1d_filter:
          enabled: true
      trailing:
        enabled: true
        breakeven_at: 0.5
        trail_activate: 1.0
        trail_step: 0.5

# ─── NOTIFICATIONS ──────────────────────────────────────────
notifications:
  telegram:
    enabled: true
    bot_token: ""
    chat_id: ""
