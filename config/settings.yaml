# Donchian 20 — пул 10, валидирован в H26 (H24 + фильтр H25 по netR).
# Результат H26 при risk=0.35%, cap=6, издержках 0.14% RT:
#   1827 сделок, expectancy +0.1690R, WR 42.3%, PF 1.488, exposure 19.8%
#   MC return p5 74.6% / med 179.9% / p95 370.8%, DD p95 15.5%, P(DD>30%)=0.0%
#   vs pool14: expR 0.121->0.169, PF 1.34->1.49, DD 14.7%->13.0%, DD p95 20.7%->15.5%
# Удалены аутсайдеры H25 (netR после издержек): SOL -0.023, TON -0.003,
# APT 0.001, ETH 0.047.  XMR/LTC/BTC не возвращены: 0.010 / 0.013 / -0.134.
#
# ВАЖНО: параметры strategy/trailing/filters ниже — заглушки SMC. Дончиан их
# не читает. Нужны, потому что код падает на config['strategy'] для символов
# без собственной секции. Не править их «под SMC» — это мёртвый код.

strategy:
  lookback: 20
  sweep_threshold: 0.008
  center_proximity: 0.012
  tp_multiplier: 1.0
  timeout: 15
  tp_mode: structure
  structure_tp_lookback: 50

trailing:
  # Donchian использует ATR-трейлинг из DonchianConfig.trail_atr, не этот блок.
  enabled: false
  breakeven_at: 0.0
  trail_activate: 0.0
  trail_step: 0.0

risk:
  risk_percent: 0.35        # sizing = equity * 0.35% / (2*ATR)  — H24
  commission: 0.00055        # Bybit taker, фактические 0.055%
  slippage: 0.00015          # 0.015% на сторону -> 0.14% round-trip
  stop_buffer: 0.0
  max_drawdown: 20.0         # единственный halt, валидированный в H24
  max_daily_loss: 100.0      # ОТКЛЮЧЕНО: в H24 этих лимитов не было
  max_consecutive_losses: 99 # ОТКЛЮЧЕНО: серия 3 стопов режет 40.8%-WR
  max_daily_trades: 500      # ОТКЛЮЧЕНО
  max_concurrent_positions: 6
  max_leverage: 10
  commission_haircut: 0.0    # H24-паритет: без вычета комиссии из риска

# ─── ER-фильтр входа Donchian (H32/H33/H36) ─────────────────────────
# Пробои 20-канала зарабатывают только в трендовом рынке. Kaufman ER(20)
# против медианы: тренд expR +0.319 (PF 2.11) vs хаос -0.097 (PF 0.73),
# p<0.0001, эффект одинаков в обеих половинах по волатильности.
#
# Walk-forward (H33), порог на train -> test, 6 окон OOS:
#   baseline 1488 сделок expR 0.161 PF 1.459 +107.2% DD 13.0% PF>=1 5/6
#   вариант A 1244       expR 0.202 PF 1.604 +118.9% DD 10.8% PF>=1 6/6
#   MC: p5 52.4% против 45.0%, DD p95 14.3% против 16.6%, P(DD>20%) 0.1% против 1.1%
# Фильтр режет ТОЛЬКО вход. Стоп, трейлинг и time-stop не тронуты.
#
# Порог скользящий (медиана ER за 950 баров), НЕ зашитая константа:
# в H36 проверено, что window=950 воспроизводит замороженный train-порог
# (expR 0.202 / PF 1.609 / +118.1% против 0.202 / 1.604 / +118.9%).
# Бот тянет 1000 баров 4H — это лимит Bybit на один запрос /v5/market/kline.
#
# ОГОВОРКА: проверено на 2024-04..2026-09 in-sample. Walk-forward честен по
# порогу, но сам вопрос «а не попробовать ли ER?» задан на всей выборке.
# На демо риск ограничен, на боевом пересмотреть после 3-6 месяцев.
donchian:
  er_filter: true
  er_period: 20
  er_threshold_window: 950

dynamic_risk:
  # H23: динамическое масштабирование провалило prereg (эффективность 0.06-0.09
  # вместо >1.0). Статический риск + жёсткий halt.
  enabled: false
  base_risk: 0.35
  min_risk: 0.35
  max_risk: 0.35
  dd_threshold_1: 10.0
  dd_threshold_2: 20.0
  pf_hot: 99.0
  pf_window: 20

filters:
  adx_filter:
    enabled: false
    min_adx: 0
  vwap_filter:
    enabled: false
  session_filter:
    enabled: false
  volume_filter:
    enabled: false
    volume_multiplier: 1.5

optimizer:
  # Дончиан не SMC: auto_optimizer переписывает lookback/sweep_threshold.
  # Дополнительно каждый asset помечен lock_config: true.
  enabled: false
  trigger_days: 90
  trigger_trades: 15
  trigger_pf_drop: 1.2
  cooldown_trades: 30
  optimize_params: []
  param_ranges: {}
  min_improvement: 0.1

